name: Update GitHub streak card

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-streak
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate streak SVG from GitHub data
        run: node scripts/generate-github-streak.mjs 1naichii github-streak.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild full profile SVG
        run: node scripts/generate-profile.mjs
      - name: Commit updated profile
        run: |
          if git diff --quiet -- github-streak.svg profile.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-streak.svg profile.svg
          git commit -m "chore(profile): update GitHub activity"
          git push
