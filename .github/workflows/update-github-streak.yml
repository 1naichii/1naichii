name: Update pixel profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-streak
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install SVG optimization tools
        run: npm ci
      - name: Rebuild profile SVG from GitHub data
        run: node scripts/generate-profile.mjs 1naichii
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate optimized SVGs
        run: npm run validate:svg
      - name: Commit updated profile
        run: |
          if git diff --quiet -- profile.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          git commit -m "chore(profile): update GitHub activity"
          git push
