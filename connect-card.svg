<svg xmlns="http://www.w3.org/2000/svg" width="680" height="170" viewBox="0 0 680 170" role="img" aria-labelledby="title description">
  <title id="title">Connect with Mochaa</title>
  <desc id="description">Find Mochaa on LinkedIn and X. Includes the quote: build with intention, ship with confidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b1f28"/><stop offset="1" stop-color="#1e151c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e96a9d"/><stop offset="1" stop-color="#f7c5d8"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="678" height="168" rx="16" fill="url(#background)" stroke="#f29ab7" stroke-width="2"/>
  <g font-family="JetBrains Mono, Consolas, monospace">
    <text x="30" y="40" fill="#f29ab7" font-size="10" font-weight="700" letter-spacing="1.4">~/CONNECT</text>
    <text x="30" y="76" fill="#fde8ef" font-size="20" font-weight="700">Let's build something meaningful.</text>
    <text x="30" y="104" fill="#f7c5d8" font-size="12">LinkedIn /in/naufalzakariya</text>
    <text x="30" y="127" fill="#f7c5d8" font-size="12">X @1naichii</text>
    <path d="M416 25V145" stroke="#f29ab7" stroke-opacity=".2"/>
    <text x="448" y="65" fill="#e96a9d" font-size="34" font-weight="700">“</text>
    <text x="474" y="72" fill="#fde8ef" font-size="13">build with intention,</text>
    <text x="474" y="96" fill="#fde8ef" font-size="13">ship with confidence.</text>
    <rect x="474" y="116" width="142" height="2" rx="1" fill="url(#accent)"/>
  </g>
</svg>
