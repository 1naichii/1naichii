<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-labelledby="title description">
  <title id="title">Mochaa developer profile terminal</title>
  <desc id="description">Mochaa is a Full-Stack Developer in Surabaya, Indonesia, open to work and collaboration.</desc>

  <rect x="1" y="1" width="678" height="248" rx="12" fill="#2b1f28" stroke="#f29ab7" stroke-width="2" />

  <circle cx="22" cy="22" r="6" fill="#e96a9d" />
  <circle cx="42" cy="22" r="6" fill="#f7c5d8" />
  <circle cx="62" cy="22" r="6" fill="#fff4e8" />
  <text x="340" y="27" fill="#fde8ef" fill-opacity="0.7" font-family="JetBrains Mono, Consolas, monospace" font-size="13" text-anchor="middle">mochaa@github: ~</text>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="15">
    <text x="32" y="60" fill="#f29ab7" font-weight="700">$</text>
    <text x="50" y="60" fill="#f7c5d8" font-weight="600">whoami</text>
    <text x="50" y="82" fill="#fff4e8">&gt; Mochaa</text>

    <text x="32" y="110" fill="#f29ab7" font-weight="700">$</text>
    <text x="50" y="110" fill="#f7c5d8" font-weight="600">cat role.txt</text>
    <text x="50" y="132" fill="#fff4e8">&gt; Full-Stack Developer</text>

    <text x="32" y="160" fill="#f29ab7" font-weight="700">$</text>
    <text x="50" y="160" fill="#f7c5d8" font-weight="600">echo $LOCATION</text>
    <text x="50" y="182" fill="#fff4e8">&gt; Surabaya, Indonesia</text>

    <text x="32" y="210" fill="#f29ab7" font-weight="700">$</text>
    <text x="50" y="210" fill="#f7c5d8" font-weight="600">echo $STATUS</text>
    <text x="50" y="232" fill="#e96a9d">&gt; Open to Work and Collaboration</text>
  </g>
</svg>
