<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" role="img" aria-labelledby="title description">
  <title id="title">Mochaa, Full-Stack Developer</title>
  <desc id="description">Pink developer profile header for Mochaa, building web applications, APIs, and real-time systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2b1f28"/>
      <stop offset="1" stop-color="#1e151c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e96a9d"/>
      <stop offset=".5" stop-color="#f29ab7"/>
      <stop offset="1" stop-color="#f7c5d8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#e96a9d" stop-opacity=".24"/>
      <stop offset="1" stop-color="#e96a9d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#f29ab7" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="678" height="218" rx="16" fill="url(#background)" stroke="#f29ab7" stroke-width="2"/>
  <rect x="1" y="1" width="678" height="218" rx="16" fill="url(#grid)"/>
  <circle cx="620" cy="12" r="155" fill="url(#glow)"/>
  <circle cx="46" cy="37" r="5" fill="#e96a9d"/>
  <circle cx="64" cy="37" r="5" fill="#f29ab7"/>
  <circle cx="82" cy="37" r="5" fill="#f7c5d8"/>
  <text x="634" y="41" fill="#f7c5d8" font-family="JetBrains Mono, Consolas, monospace" font-size="10" text-anchor="end" letter-spacing="1.4">PROFILE.EXE</text>

  <g font-family="JetBrains Mono, Consolas, monospace">
    <text x="42" y="94" fill="#fde8ef" font-size="35" font-weight="700">Hi, I'm Mochaa<tspan fill="#e96a9d">.</tspan></text>
    <rect x="42" y="107" width="365" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="42" y="139" fill="#f7c5d8" font-size="15">Full-Stack Developer / Backend &amp; API Builder</text>
    <text x="42" y="164" fill="#fde8ef" fill-opacity=".72" font-size="12">Building reliable web apps and real-time systems.</text>

    <g transform="translate(42 183)" font-size="9" font-weight="700">
      <rect width="101" height="22" rx="11" fill="#e96a9d" fill-opacity=".16" stroke="#e96a9d" stroke-opacity=".55"/>
      <circle cx="13" cy="11" r="3" fill="#e96a9d"/>
      <text x="23" y="14" fill="#f7c5d8">SURABAYA, ID</text>
      <rect x="111" width="140" height="22" rx="11" fill="#f29ab7" fill-opacity=".12" stroke="#f29ab7" stroke-opacity=".45"/>
      <circle cx="124" cy="11" r="3" fill="#f29ab7"/>
      <text x="134" y="14" fill="#fde8ef">OPEN TO COLLABORATE</text>
    </g>
  </g>
</svg>
